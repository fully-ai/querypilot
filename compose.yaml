services:
  querypilot:
    build: .
    container_name: querypilot
    ports:
      - "127.0.0.1:8092:8092"
    environment:
      QUERYPILOT_HOST: "0.0.0.0"
      QUERYPILOT_PORT: "8092"
      QUERYPILOT_DATA_DIR: "/data"
      QUERYPILOT_JWT_SECRET: "${QUERYPILOT_JWT_SECRET:-change-me-jwt-secret}"
      QUERYPILOT_MASTER_KEY: "${QUERYPILOT_MASTER_KEY:-change-me-master-key}"
    volumes:
      - querypilot_data:/data
    restart: unless-stopped

volumes:
  querypilot_data:
