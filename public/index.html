<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QueryPilot — Multi-Engine SQL Workbench</title>
  <style>
    :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#e6edf3; --muted:#8b949e; --accent:#2f81f7; --danger:#da3633; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui, sans-serif; background:var(--bg); color:var(--fg); }
    .topbar { display:flex; justify-content:space-between; align-items:center; padding:10px 18px; border-bottom:1px solid var(--border); background:var(--panel); }
    .layout { display:grid; grid-template-columns:280px 1fr; min-height:calc(100vh - 49px); }
    .sidebar { border-right:1px solid var(--border); background:var(--panel); padding:12px; overflow-y:auto; }
    .main { padding:16px; display:flex; flex-direction:column; gap:12px; }
    .card { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:12px; }
    input, select, button, textarea { padding:7px 10px; border-radius:6px; border:1px solid var(--border); background:#21262d; color:var(--fg); font-size:0.88rem; }
    button { background:var(--accent); border:none; cursor:pointer; font-weight:600; }
    button.ghost { background:#21262d; border:1px solid var(--border); }
    button.sm { padding:4px 8px; font-size:0.78rem; }
    textarea.sql { width:100%; min-height:150px; font-family:ui-monospace, monospace; line-height:1.45; resize:vertical; background:#0d1117; }
    table { width:100%; border-collapse:collapse; font-size:0.84rem; }
    th, td { padding:6px 8px; border-bottom:1px solid var(--border); text-align:left; }
    .list-item { padding:6px 8px; border-radius:5px; cursor:pointer; font-size:0.86rem; }
    .list-item:hover { background:#21262d; }
    .pill { display:inline-block; padding:2px 6px; border-radius:4px; background:#30363d; font-size:0.72rem; }
    .hidden { display:none !important; }
    svg { width:100%; height:220px; background:#0d1117; border:1px solid var(--border); border-radius:6px; }
  </style>
</head>
<body>
  <div class="topbar">
    <strong>QueryPilot</strong>
    <div id="user-info" class="hidden"><span id="who" style="color:var(--muted);margin-right:10px;"></span><button class="ghost sm" onclick="logout()">Sign Out</button></div>
  </div>
  <div id="auth" class="card" style="max-width:420px;margin:70px auto;display:flex;flex-direction:column;gap:10px;">
    <h2 style="margin:0;">Sign In to QueryPilot</h2>
    <input id="au" placeholder="Username" />
    <input id="ap" type="password" placeholder="Password (min 8 chars)" />
    <div style="display:flex;gap:8px;">
      <button onclick="doAuth('/api/auth/login')">Sign In</button>
      <button class="ghost" onclick="doAuth('/api/auth/register')">Register</button>
    </div>
    <div id="aerr" style="color:#f85149;font-size:0.85rem;"></div>
  </div>

  <div id="workspace" class="layout hidden">
    <aside class="sidebar">
      <div style="display:flex;gap:6px;margin-bottom:8px;">
        <select id="conn-sel" style="flex:1;" onchange="selectConnection()"></select>
        <button class="ghost sm" onclick="toggleConnForm()">+</button>
      </div>
      <div id="conn-form" class="card hidden" style="margin-bottom:10px;display:flex;flex-direction:column;gap:6px;">
        <input id="cn-name" placeholder="Profile name" />
        <select id="cn-eng"><option value="sqlite">sqlite</option><option value="postgres">postgres</option><option value="mysql">mysql</option></select>
        <input id="cn-uri" placeholder="Path or URI" />
        <label style="font-size:0.8rem;"><input id="cn-ro" type="checkbox" /> Read-only mode</label>
        <button class="sm" onclick="createConn()">Save Profile</button>
      </div>
      <strong style="font-size:0.82rem;color:var(--muted);">TABLES &amp; VIEWS</strong>
      <div id="tables-list" style="margin:6px 0 12px;"></div>
      <strong style="font-size:0.82rem;color:var(--muted);">SAVED QUERIES</strong>
      <div id="saved-list" style="margin-top:6px;"></div>
    </aside>

    <main class="main">
      <div class="card">
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;align-items:center;">
          <button onclick="runSql(false)">Run Query</button>
          <button class="ghost" onclick="runSql(true)">Explain Plan</button>
          <button class="ghost" onclick="saveCurrentQuery()">Save Query</button>
          <button class="ghost" onclick="exportData('csv')">Export CSV</button>
          <button class="ghost" onclick="exportData('sql')">Export SQL</button>
          <button class="ghost" onclick="runBackup()">Backup SQL</button>
          <button class="ghost" onclick="loadER()">ER Diagram</button>
          <span id="exec-meta" style="margin-left:auto;color:var(--muted);font-size:0.84rem;"></span>
        </div>
        <textarea id="sql-editor" class="sql" list="sql-hints" placeholder="SELECT * FROM sqlite_master;"></textarea>
        <div style="margin-top:6px;font-size:0.78rem;color:var(--muted);">Autocomplete hints: <span id="ac-hints">SELECT, FROM, WHERE, JOIN, EXPLAIN</span></div>
      </div>

      <div id="er-card" class="card hidden">
        <div style="display:flex;justify-content:space-between;"><strong>Foreign-Key Relationships</strong><button class="ghost sm" onclick="document.getElementById('er-card').classList.add('hidden')">Close</button></div>
        <svg id="er-svg" viewBox="0 0 700 220" style="margin-top:8px;"></svg>
      </div>

      <div class="card" style="overflow-x:auto;">
        <strong>Results / Schema Details</strong>
        <div id="results-area" style="margin-top:8px;"><small style="color:var(--muted);">Run a query or click a table in the browser.</small></div>
      </div>

      <div class="card">
        <strong>Recent Query History</strong>
        <ul id="hist-list" style="font-size:0.82rem;color:var(--muted);padding-left:18px;margin-bottom:0;"></ul>
      </div>
    </main>
  </div>

  <script>
    let token = localStorage.getItem('qp_token') || '';
    function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
    async function api(url, opts = {}) {
      const headers = { ...(opts.headers || {}) };
      if (token) headers.Authorization = 'Bearer ' + token;
      const r = await fetch(url, { ...opts, headers });
      const ct = r.headers.get('content-type') || '';
      if (!r.ok) {
        const d = ct.includes('json') ? await r.json().catch(()=>({})) : { error: await r.text() };
        throw new Error(d.error || 'Request failed');
      }
      return ct.includes('json') ? r.json() : r.text();
    }
    async function doAuth(ep) {
      try {
        const res = await api(ep, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username: document.getElementById('au').value, password: document.getElementById('ap').value }) });
        token = res.token; localStorage.setItem('qp_token', token);
        document.getElementById('who').textContent = `${res.user.username} (${res.user.role})`;
        document.getElementById('auth').classList.add('hidden');
        document.getElementById('workspace').classList.remove('hidden');
        document.getElementById('user-info').classList.remove('hidden');
        await loadConnections();
      } catch (e) { document.getElementById('aerr').textContent = e.message; }
    }
    function logout() { token = ''; localStorage.removeItem('qp_token'); location.reload(); }
    function toggleConnForm() { document.getElementById('conn-form').classList.toggle('hidden'); }
    async function createConn() {
      await api('/api/connections', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ name: document.getElementById('cn-name').value, engine: document.getElementById('cn-eng').value, uri: document.getElementById('cn-uri').value, read_only: document.getElementById('cn-ro').checked })
      });
      toggleConnForm(); await loadConnections();
    }
    async function loadConnections() {
      const { connections } = await api('/api/connections');
      const sel = document.getElementById('conn-sel');
      sel.innerHTML = '';
      for (const c of connections) {
        const o = document.createElement('option');
        o.value = c.id; o.textContent = `${c.name} (${c.engine}${c.read_only ? ' RO' : ''})`;
        sel.appendChild(o);
      }
      if (connections.length) await selectConnection();
    }
    async function selectConnection() {
      const cid = document.getElementById('conn-sel').value;
      if (!cid) return;
      const { tables } = await api(`/api/connections/${cid}/tables`);
      document.getElementById('tables-list').innerHTML = tables.map(t =>
        `<div class="list-item" onclick="inspectTable('${esc(t.name)}')">${esc(t.name)} <span class="pill">${esc(t.type)}</span></div>`
      ).join('') || '<small style="color:var(--muted)">No tables</small>';
      document.getElementById('ac-hints').textContent = ['SELECT', 'FROM', 'WHERE', 'ORDER BY', ...tables.map(t => t.name)].join(', ');
      const sq = await api(`/api/saved-queries?connection_id=${encodeURIComponent(cid)}`);
      document.getElementById('saved-list').innerHTML = sq.saved_queries.map(q =>
        `<div class="list-item" onclick="loadSql(${JSON.stringify(q.sql_text)})">${esc(q.name)}</div>`
      ).join('');
      const hist = await api(`/api/history?connection_id=${encodeURIComponent(cid)}`);
      document.getElementById('hist-list').innerHTML = hist.history.slice(0, 12).map(h =>
        `<li>[${esc(h.status)} • ${h.duration_ms}ms] <code>${esc(h.sql_text)}</code></li>`
      ).join('');
    }
    function loadSql(s) { document.getElementById('sql-editor').value = s; }
    async function inspectTable(tbl) {
      const cid = document.getElementById('conn-sel').value;
      const info = await api(`/api/connections/${cid}/tables/${encodeURIComponent(tbl)}`);
      const data = await api(`/api/connections/${cid}/tables/${encodeURIComponent(tbl)}/data?limit=25`);
      const schemaHtml = `<div><strong>${esc(tbl)}</strong> columns: ` + info.columns.map(c => `<span class="pill">${esc(c.name)}: ${esc(c.type)}${c.primaryKey?' PK':''}</span>`).join(' ') + `</div>`;
      document.getElementById('results-area').innerHTML = schemaHtml + '<div style="margin-top:10px;">' + renderTable(data.columns, data.rows) + '</div>';
    }
    function renderTable(cols, rows) {
      if (!cols || !cols.length) return '<small style="color:var(--muted)">Statement succeeded (0 rows returned).</small>';
      return `<table><thead><tr>${cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${
        rows.map(r => `<tr>${cols.map(c => `<td>${esc(r[c])}</td>`).join('')}</tr>`).join('')
      }</tbody></table>`;
    }
    async function runSql(explain) {
      const cid = document.getElementById('conn-sel').value;
      const sql = document.getElementById('sql-editor').value;
      const res = await api(`/api/connections/${cid}/query`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ sql, explain }) });
      document.getElementById('exec-meta').textContent = `${res.rowCount} rows • ${res.durationMs} ms`;
      document.getElementById('results-area').innerHTML = renderTable(res.columns, res.rows);
      await selectConnection();
    }
    async function saveCurrentQuery() {
      const cid = document.getElementById('conn-sel').value;
      const name = prompt('Query name:');
      if (!name) return;
      await api('/api/saved-queries', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ connection_id: cid, name, sql: document.getElementById('sql-editor').value }) });
      await selectConnection();
    }
    async function exportData(fmt) {
      const cid = document.getElementById('conn-sel').value;
      const txt = await api(`/api/connections/${cid}/export`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ format: fmt, sql: document.getElementById('sql-editor').value }) });
      const blob = new Blob([txt], { type:'text/plain' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `export.${fmt}`; a.click();
    }
    async function runBackup() {
      const cid = document.getElementById('conn-sel').value;
      const b = await api(`/api/connections/${cid}/backup`, { method:'POST' });
      document.getElementById('exec-meta').textContent = `Backup saved: ${b.backup_id} (${b.size_bytes} B)`;
    }
    async function loadER() {
      const cid = document.getElementById('conn-sel').value;
      const { relationships } = await api(`/api/connections/${cid}/relationships`);
      document.getElementById('er-card').classList.remove('hidden');
      const tables = [...new Set(relationships.flatMap(r => [r.fromTable, r.toTable]))];
      const pos = {};
      tables.forEach((t, i) => { pos[t] = { x: 40 + (i % 4) * 165, y: 35 + Math.floor(i / 4) * 90 }; });
      const edgesSvg = relationships.map(r => {
        const a = pos[r.fromTable], b = pos[r.toTable];
        return `<line x1="${a.x+55}" y1="${a.y+18}" x2="${b.x+55}" y2="${b.y+18}" stroke="#58a6ff" stroke-width="1.5" />`;
      }).join('');
      const nodesSvg = tables.map(t => `<rect x="${pos[t].x}" y="${pos[t].y}" width="110" height="36" rx="6" fill="#161b22" stroke="#30363d"/><text x="${pos[t].x+55}" y="${pos[t].y+22}" fill="#e6edf3" font-size="12" text-anchor="middle">${esc(t)}</text>`).join('');
      document.getElementById('er-svg').innerHTML = edgesSvg + nodesSvg || '<text x="20" y="30" fill="#8b949e">No foreign keys detected.</text>';
    }
  </script>
</body>
</html>
